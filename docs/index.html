  { key: "length", label: "nt", num: true },
  { key: "gc_pct", label: "GC%", num: true, sm: true },
  { key: "tm_c", label: "Tm °C", num: true },
  { key: "pair_tm_diff", label: "ΔTm pair", num: true, sm: true },
  { key: "_notes", label: "", nosort: true }
];

const byId = new Map(PRIMERS.map(p => [p.primer_id, p]));
const selected = new Set();
const openNotes = new Set();
let sortKey = "primer_id", sortDir = 1;
const $ = id => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

function init() {
  const species = [...new Set(PRIMERS.map(p => p.species))].sort();
  for (const s of species) $("species").insertAdjacentHTML("beforeend", `<option>${esc(s)}</option>`);
  for (const s of IDT_SCALES) $("scale").insertAdjacentHTML("beforeend", `<option value="${s}">Scale ${s}</option>`);
  for (const s of IDT_PURIFICATIONS) $("purification").insertAdjacentHTML("beforeend", `<option value="${s}">${s === "STD" ? "Standard desalting" : s}</option>`);
  $("sub").textContent = `${PRIMERS.length} primers · search, tick primers, then download an IDT order file`;
  $("head").innerHTML = COLS.map(c =>
    `<th data-key="${c.key}" class="${c.nosort ? "nosort" : ""} ${c.sm ? "hide-sm" : ""}">${esc(c.label)} <span class="arrow"></span></th>`).join("");
  $("head").addEventListener("click", e => {
    const th = e.target.closest("th"); if (!th || th.classList.contains("nosort")) return;
    const k = th.dataset.key; sortDir = k === sortKey ? -sortDir : 1; sortKey = k; render();
  });
  $("q").addEventListener("input", render);
  $("species").addEventListener("change", render);
  $("inNotes").addEventListener("change", render);
  $("body").addEventListener("change", e => {
    if (e.target.matches("input[data-id]")) toggle(e.target.dataset.id, e.target.checked);
  });
  $("body").addEventListener("click", e => {
    const b = e.target.closest(".notes-toggle"); if (!b) return;
    const id = b.dataset.id; openNotes.has(id) ? openNotes.delete(id) : openNotes.add(id); render();
  });
  $("selVisible").addEventListener("click", () => { visible().forEach(p => toggle(p.primer_id, true, true)); render(); });
  $("clear").addEventListener("click", () => { selected.clear(); render(); });
  $("format").addEventListener("change", updateBar);
  $("download").addEventListener("click", download);
  $("copy").addEventListener("click", copy);
  render();
}

function visible() {
  // Every word (or "quoted phrase") must match somewhere in the searched fields.
  const words = [...$("q").value.toLowerCase().matchAll(/"([^"]+)"|(\S+)/g)].map(m => m[1] ?? m[2]);
  const sp = $("species").value, inNotes = $("inNotes").checked;
  const rows = PRIMERS.filter(p => {
    if (sp && p.species !== sp) return false;
    const hay = [p.primer_id, p.name, p.target, p.sequence, inNotes ? p.notes : ""].join(" ").toLowerCase();
    return words.every(w => hay.includes(w));
  });
  const col = COLS.find(c => c.key === sortKey);
  return rows.sort((a, b) => {
    let x = a[sortKey], y = b[sortKey];
    if (col && col.num) { x = x ?? -Infinity; y = y ?? -Infinity; return (x - y) * sortDir; }
    return String(x).localeCompare(String(y), undefined, { numeric: true }) * sortDir;
  });
}

function toggle(id, on, quiet) {
  const ids = [id];
  const partner = byId.get(id)?.partner_id;
  if ($("pairs").checked && partner && byId.has(partner)) ids.push(partner);
  for (const i of ids) on ? selected.add(i) : selected.delete(i);
  if (!quiet) render();
}

function render() {
  const rows = visible();
  document.querySelectorAll("#head th").forEach(th => {
    th.querySelector(".arrow").textContent = th.dataset.key === sortKey ? (sortDir > 0 ? "▲" : "▼") : "";
  });
  $("empty").hidden = rows.length > 0;
  $("body").innerHTML = rows.map(p => {
    const sel = selected.has(p.primer_id);
    const dtm = p.pair_tm_diff;
    const main = `<tr class="${sel ? "sel" : ""}">
      <td><input type="checkbox" data-id="${esc(p.primer_id)}" ${sel ? "checked" : ""} aria-label="Select ${esc(p.primer_id)}"></td>
      <td class="id">${esc(p.primer_id)}</td>
      <td>${esc(p.name)}</td>
      <td class="target">${esc(p.target)}</td>
      <td><span class="dir">${esc(p.direction)}</span></td>
      <td class="seq">${esc(p.sequence)}</td>
      <td class="num">${p.length ?? ""}</td>
      <td class="num hide-sm">${p.gc_pct ?? ""}</td>
      <td class="num">${p.tm_c ?? "–"}</td>
      <td class="num hide-sm ${dtm != null && dtm > 5 ? "flag" : ""}" title="${dtm != null && dtm > 5 ? "Pair Tm differs by more than 5 °C" : ""}">${dtm ?? ""}</td>
      <td>${p.notes ? `<button class="notes-toggle" data-id="${esc(p.primer_id)}">${openNotes.has(p.primer_id) ? "Hide notes" : "Notes"}</button>` : ""}</td>
    </tr>`;
    const notes = openNotes.has(p.primer_id) ? `<tr class="notes"><td></td><td colspan="${COLS.length - 1}">${esc(p.notes)}</td></tr>` : "";
    return main + notes;
  }).join("");
  updateBar();
}

function selectedRows() {
  return PRIMERS.filter(p => selected.has(p.primer_id))
    .sort((a, b) => a.primer_id.localeCompare(b.primer_id, undefined, { numeric: true }));
}

function updateBar() {
  const n = selected.size, fmt = $("format").value, plate = fmt === "plate";
  $("count").textContent = n;
  $("scale").hidden = $("purification").hidden = plate;
  $("fill").hidden = !plate;
  $("copy").hidden = fmt !== "tubes";
  $("download").disabled = $("copy").disabled = n === 0;
  const msg = $("msg"); msg.classList.remove("warn");
  if (!n) msg.textContent = "Tick primers to order. Names are exported as <ID>_<name>.";
  else if (plate) {
    const plates = Math.ceil(n / 96), last = n % 96 || 96;
    msg.textContent = `${n} oligos on ${plates} plate${plates > 1 ? "s" : ""}. Set scale and purification in IDT's plate form.`;
    if (last < 24) { msg.textContent += ` The last plate has ${last} oligos; IDT plate orders may need more.`; msg.classList.add("warn"); }
  } else {
    const half = selectedRows().filter(p => p.partner_id && !selected.has(p.partner_id));
    msg.textContent = `${n} tube${n > 1 ? "s" : ""}.` + (half.length ? ` Partner not selected for: ${half.map(p => p.primer_id).join(", ")}.` : "");
    if (half.length) msg.classList.add("warn");
  }
}

// ---- IDT order tables (same layout as R/idt.R) ----
const idtName = p => `${p.primer_id}_${p.name}`;
function tubesTable(rows) {
  const scale = $("scale").value, pur = $("purification").value;
  return [["Name", "Sequence", "Scale", "Purification"], ...rows.map(p => [idtName(p), p.sequence, scale, pur])];
}
function platesTables(rows) {
  const L = "ABCDEFGH".split("");
  const wells = [];
  if ($("fill").value === "cols") { for (let c = 1; c <= 12; c++) for (const r of L) wells.push(r + c); }
  else { for (const r of L) for (let c = 1; c <= 12; c++) wells.push(r + c); }
  const out = [];
  for (let i = 0; i < rows.length; i += 96) {
    out.push(["Plate" + (out.length + 1), [["Well Position", "Name", "Sequence"],
      ...rows.slice(i, i + 96).map((p, j) => [wells[j], idtName(p), p.sequence])]]);
  }
  return out;
}

// ---- minimal .xlsx writer: inline-string cells, stored (uncompressed) zip ----
const CRC_TABLE = (() => { const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; }
  return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_TABLE[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder(), chunks = [], central = []; let offset = 0;
  const u16 = v => [v & 255, (v >>> 8) & 255], u32 = v => [v & 255, (v >>> 8) & 255, (v >>> 16) & 255, (v >>> 24) & 255];
  for (const [name, text] of files) {
    const n = enc.encode(name), d = enc.encode(text), crc = crc32(d);
    const common = [...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(d.length), ...u32(d.length), ...u16(n.length), ...u16(0)];
    const local = new Uint8Array([...u32(0x04034b50), ...common]);
    chunks.push(local, n, d);
    central.push(new Uint8Array([...u32(0x02014b50), ...u16(20), ...common, ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), n);
    offset += local.length + n.length + d.length;
  }
  const cdSize = central.reduce((s, c) => s + c.length, 0);
  const end = new Uint8Array([...u32(0x06054b50), ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  return new Blob([...chunks, ...central, end], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
function xmlEsc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
function sheetXml(rows) {
  const body = rows.map((r, i) => `<row r="${i + 1}">` + r.map((v, j) =>
    `<c r="${String.fromCharCode(65 + j)}${i + 1}" t="inlineStr"><is><t>${xmlEsc(v)}</t></is></c>`).join("") + "</row>").join("");
  return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetData>${body}</sheetData></worksheet>`;
}
function xlsx(sheets) {
  const ns = "http://schemas.openxmlformats.org", n = sheets.length;
  const idx = [...Array(n).keys()].map(i => i + 1);
  return zipStore([
    ["[Content_Types].xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="${ns}/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>` +
      idx.map(i => `<Override PartName="/xl/worksheets/sheet${i}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join("") + "</Types>"],
    ["_rels/.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}/package/2006/relationships"><Relationship Id="rId1" Type="${ns}/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ["xl/workbook.xml", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="${ns}/spreadsheetml/2006/main" xmlns:r="${ns}/officeDocument/2006/relationships"><sheets>` +
      sheets.map(([name], i) => `<sheet name="${xmlEsc(name)}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join("") + "</sheets></workbook>"],
    ["xl/_rels/workbook.xml.rels", `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="${ns}/package/2006/relationships">` +
      idx.map(i => `<Relationship Id="rId${i}" Type="${ns}/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i}.xml"/>`).join("") + "</Relationships>"],
    ...sheets.map(([, rows], i) => [`xl/worksheets/sheet${i + 1}.xml`, sheetXml(rows)])
  ]);
}

function orderFile() {
  const rows = selectedRows(), fmt = $("format").value, day = new Date().toISOString().slice(0, 10);
  if (fmt === "tubes") {
    const text = tubesTable(rows).map(r => r.join("\t")).join("\n") + "\n";
    return { blob: new Blob([text], { type: "text/plain" }), name: `idt_tubes_${day}.txt`, text };
  }
  if (fmt === "tubes-xlsx") return { blob: xlsx([["Tubes", tubesTable(rows)]]), name: `idt_tubes-xlsx_${day}.xlsx` };
  return { blob: xlsx(platesTables(rows)), name: `idt_plate_${day}.xlsx` };
}

function download() {
  const f = orderFile(), a = document.createElement("a");
  a.href = URL.createObjectURL(f.blob); a.download = f.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

async function copy() {
  const f = orderFile();
  try { await navigator.clipboard.writeText(f.text); $("msg").textContent = `Copied ${selected.size} lines. Paste into IDT bulk input (tab-delimited).`; }
  catch { $("msg").textContent = "Copy failed in this browser; use Download instead."; }
}

init();
</script>
</body>
</html>
