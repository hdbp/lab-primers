name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unit tests (R)
        run: Rscript tests/run_tests.R
      - name: Unit tests (web app; checks JS against R)
        run: |
          node tests/test_core.js
          node tests/test_github.js
      - name: Validate primers.tsv
        run: Rscript R/validate.R primers.tsv
      - name: Build the site
        run: Rscript R/build.R
