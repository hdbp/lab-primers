name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: Unit tests
        run: Rscript tests/run_tests.R
      - name: Validate primers.tsv
        run: Rscript R/validate.R primers.tsv
      - name: Check build/ and docs/ are up to date
        run: |
          Rscript R/build.R
          git add -N build/ docs/
          git diff --exit-code build/ docs/ || {
            echo "::error::build/ or docs/ is stale. Run 'Rscript R/build.R' and commit the result."
            exit 1
          }
